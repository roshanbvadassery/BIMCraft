name: Zopu release

# Zopu's build of the headless CLI from this fork. Push a tag `zopu-<version>-<n>` (e.g.
# zopu-0.9.0-1) and this attaches `bimcraft-cli-linux-<arch>.tar.gz` and its `.sha256` to a
# GitHub Release; Zopu's bim-engineer expert downloads them on the user's machine. The CLI
# needs only bimcraft-core (no window, no updater), so no desktop headers are installed.

permissions: {}

on:
  push:
    tags:
      - "zopu-*"
  workflow_dispatch:

jobs:
  build:
    name: CLI ${{ matrix.arch }}
    # The oldest Ubuntu runner, so the binary needs glibc 2.35 at most.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup update stable && rustup default stable
      - name: Test the core
        run: cargo test --locked -p bimcraft-core -p bimcraft-cli
      - name: Build
        run: cargo build --release --locked -p bimcraft-cli
      - name: Smoke test
        run: |
          ./target/release/bimcraft-cli run --sample --save /tmp/house.ifc --save /tmp/house.glb --save /tmp/sheets.pdf
          test "$(head -c 4 /tmp/house.glb)" = glTF
      - name: Pack
        run: |
          mkdir -p out/bimcraft-cli
          cp target/release/bimcraft-cli LICENSE-MIT LICENSE-APACHE NOTICE out/bimcraft-cli/
          tar -C out -czf out/bimcraft-cli-linux-${{ matrix.arch }}.tar.gz bimcraft-cli
          (cd out && sha256sum bimcraft-cli-linux-${{ matrix.arch }}.tar.gz | tee bimcraft-cli-linux-${{ matrix.arch }}.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.arch }}
          path: out/bimcraft-cli-linux-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" out/* --title "$TAG" \
            --notes "Zopu build of bimcraft-cli at $(git rev-parse --short HEAD)."
